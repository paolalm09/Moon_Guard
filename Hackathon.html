


<html>
<head>
  <link rel="stylesheet" href="Style6.css">
</head>

<body>

<center>
<div class="moonguard-card">
  <!-- Background Doodles -->
  <svg class="doodle star" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2L15 9L22 10L17 15L18.5 22L12 18.5L5.5 22L7 15L2 10L9 9L12 2Z" />
  </svg>
  <svg class="doodle sparkle" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z" />
  </svg>
  <svg class="doodle swirl" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 10C27.9 10 10 27.9 10 50C10 72.1 27.9 90 50 90C72.1 90 90 72.1 90 50C90 32.3 75.7 18 58 18C44.3 18 33 29.3 33 43C33 53.5 41.5 62 52 62C59.7 62 66 55.7 66 48" />
  </svg>

  <!-- Cute Sleepy Moon Mascot -->
  <div class="moon-mascot">
    <span class="zzz z1">z</span>
    <span class="zzz z2">Z</span>
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <!-- Nightcap -->
      <path
        d="M34 38 C32 16, 62 10, 74 28 C82 22, 95 26, 92 38"
        fill="#c0bbfe"
        stroke="#2c2c2c"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Cap Brim -->
      <rect
        x="30"
        y="34"
        width="48"
        height="10"
        rx="5"
        transform="rotate(-12 54 39)"
        fill="#ff8ba7"
        stroke="#2c2c2c"
        stroke-width="3.2"
      />
      <!-- Pom-Pom Star -->
      <circle cx="93" cy="39" r="6" fill="#ffdf6c" stroke="#2c2c2c" stroke-width="3" />

      <!-- Crescent Moon Body -->
      <path
        d="M66 26 C40 28, 24 50, 28 76 C32 100, 56 112, 80 104 C92 100, 100 91, 103 82 C87 88, 68 80, 62 64 C56 48, 60 34, 66 26 Z"
        fill="#ffdf6c"
        stroke="#2c2c2c"
        stroke-width="3.8"
        stroke-linejoin="round"
      />

      <!-- Cute Craters -->
      <circle cx="43" cy="56" r="4.5" fill="#f2c444" opacity="0.7" />
      <circle cx="41" cy="84" r="6" fill="#f2c444" opacity="0.7" />
      <circle cx="62" cy="95" r="3.5" fill="#f2c444" opacity="0.7" />

      <!-- Rosy Cheeks -->
      <ellipse cx="45" cy="73" rx="5.5" ry="3.2" fill="#ff8ba7" opacity="0.85" />
      <ellipse cx="76" cy="86" rx="5" ry="3" fill="#ff8ba7" opacity="0.85" />

      <!-- Sleepy Eye (default) -->
      <path
        class="eye-closed"
        d="M47 65 Q53 70 59 65"
        fill="none"
        stroke="#2c2c2c"
        stroke-width="3.2"
        stroke-linecap="round"
      />
      <!-- Awake Eye (on card hover) -->
      <g class="eye-open">
        <circle cx="53" cy="65" r="4" fill="#2c2c2c" />
        <circle cx="51.5" cy="63.5" r="1.4" fill="#ffffff" />
      </g>

      <!-- Tiny Smile -->
      <path
        d="M58 76 Q63 81 68 76"
        fill="none"
        stroke="#2c2c2c"
        stroke-width="3"
        stroke-linecap="round"
      />
    </svg>
  </div>

  <!-- Title & Tagline -->
  <div class="card-title">
    MOONGUARD<br />
    <span>Protect Your Post</span>
  </div>

  <!-- Cute Play Button -->
  <button class="play-btn" type="button" aria-label="Play Moonguard">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 5.2C7 4.1 8.2 3.4 9.2 4L19.5 10.8C20.4 11.4 20.4 12.6 19.5 13.2L9.2 20C8.2 20.6 7 19.9 7 18.8V5.2Z" />
    </svg>
    <span>PLAY</span>
  </button>
</div>
</center>
<!-- Snow / Falling Stars -->
<div class="box-of-star1">
  <div class="star star-position1"></div>
  <div class="star star-position2"></div>
  <div class="star star-position3"></div>
  <div class="star star-position4"></div>
  <div class="star star-position5"></div>
  <div class="star star-position6"></div>
  <div class="star star-position7"></div>
</div>
<div class="box-of-star2">
  <div class="star star-position1"></div>
  <div class="star star-position2"></div>
  <div class="star star-position3"></div>
  <div class="star star-position4"></div>
  <div class="star star-position5"></div>
  <div class="star star-position6"></div>
  <div class="star star-position7"></div>
</div>
<div class="box-of-star3">
  <div class="star star-position1"></div>
  <div class="star star-position2"></div>
  <div class="star star-position3"></div>
  <div class="star star-position4"></div>
  <div class="star star-position5"></div>
  <div class="star star-position6"></div>
  <div class="star star-position7"></div>
</div>
<div class="box-of-star4">
  <div class="star star-position1"></div>
  <div class="star star-position2"></div>
  <div class="star star-position3"></div>
  <div class="star star-position4"></div>
  <div class="star star-position5"></div>
  <div class="star star-position6"></div>
  <div class="star star-position7"></div>
</div>

<!-- Astronaut -->
<div data-js="astro" class="astronaut">
  <div class="head"></div>
  <div class="arm arm-left"></div>
  <div class="arm arm-right"></div>
  <div class="body">
    <div class="panel"></div>
  </div>
  <div class="leg leg-left"></div>
  <div class="leg leg-right"></div>
  <div class="schoolbag"></div>
</div>

<!-- Rocket -->
<div class="rocket">
  <div class="rocket-body">
    <div class="body"></div>
    <div class="fin fin-left"></div>
    <div class="fin fin-right"></div>
    <div class="window"></div>
  </div>
  <div class="exhaust-flame"></div>
  <ul class="exhaust-fumes">
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
  </ul>
  <ul class="rocket-star">
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
  </ul>
</div>
</body>
</html>
